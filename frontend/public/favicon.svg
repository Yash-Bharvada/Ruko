<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Cyber Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Tech Reticle Corners -->
  <path d="M7 16V8h8M57 16V8h-8M7 48v8h8M57 48v8h-8" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  
  <!-- Stylized Indian Rupee Sign (₹) with Cyber Neon Gradient -->
  <g filter="url(#glow)">
    <!-- Top Bar 1 -->
    <path d="M20 18h24" stroke="url(#rupeeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Top Bar 2 -->
    <path d="M20 25h18" stroke="url(#rupeeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Central Curve and Diagonal Leg -->
    <path d="M26 18v15c0 0 13 0 13-7.5s-13-7.5-13-7.5l14 23.5" stroke="url(#rupeeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
